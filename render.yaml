# =============================================================================
# render.yaml - Configuração de Deploy no Render
# =============================================================================
# Documentação: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ===========================================================================
  # Frontend Next.js (Web Service)
  # ===========================================================================
  - type: web
    name: neuroeval-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: neuroeval-backend
          type: web
          property: host
    autoDeploy: true

  # ===========================================================================
  # Backend Node.js/Express (Web Service)
  # ===========================================================================
  - type: web
    name: neuroeval-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build --if-present
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: neuroeval-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: neuroeval-frontend
          type: web
          property: host
      - key: CORS_ORIGIN
        fromService:
          name: neuroeval-frontend
          type: web
          property: host
    autoDeploy: true

  # ===========================================================================
  # Banco de Dados PostgreSQL
  # ===========================================================================
databases:
  - name: neuroeval-db
    region: oregon
    plan: free
    databaseName: neuroeval
    user: neuroeval_user
    postgresMajorVersion: 15
    ipAllowList: []
