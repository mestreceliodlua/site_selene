<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Sessão de Terapia Integrativa na Clínica Selene">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a153b"/>
      <stop offset="55%" stop-color="#6B4C9A"/>
      <stop offset="100%" stop-color="#9B7ED9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fcf6ba" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fcf6ba" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="230" fill="url(#glow)"/>

  <!-- Chakra column -->
  <g transform="translate(400 250)">
    <circle cx="0" cy="-150" r="9" fill="#ff5a5a"/>
    <circle cx="0" cy="-95" r="10" fill="#ff9a3c"/>
    <circle cx="0" cy="-40" r="11" fill="#ffe14d"/>
    <circle cx="0" cy="15" r="12" fill="#5ad17a"/>
    <circle cx="0" cy="70" r="13" fill="#4aa3ff"/>
    <circle cx="0" cy="125" r="14" fill="#7c5cd8"/>
    <circle cx="0" cy="180" r="15" fill="#b65cff"/>
  </g>

  <!-- Meditating figure -->
  <g transform="translate(400 430)" fill="#f3e8ff" opacity="0.95">
    <circle cx="0" cy="-120" r="34"/>
    <path d="M-70 70 Q0 -40 70 70 Q40 30 0 30 Q-40 30 -70 70 Z"/>
    <path d="M-46 60 Q-12 -10 0 10 Q12 -10 46 60 Z"/>
  </g>

  <!-- Orchid accents -->
  <g opacity="0.5" fill="#D4AF37">
    <path transform="translate(120 110)" d="M0 0 C18 12 26 28 18 40 C10 52 -10 46 -18 34 C-26 22 -18 6 0 0 Z"/>
    <path transform="translate(660 470)" d="M0 0 C18 12 26 28 18 40 C10 52 -10 46 -18 34 C-26 22 -18 6 0 0 Z"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f3e8ff" opacity="0.85">Terapia Integrativa do Movimento</text>
</svg>
